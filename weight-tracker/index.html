/* ---------------- CSV ---------------- */
function csvCell(s){ s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCSV(){
  const u = U.unit;
  const rows = [['date','time','weight','unit','tags','note']];
  S.entries.slice().sort((a, b) => a.t - b.t).forEach(e => { const d = new Date(e.t); rows.push([keyOf(e.t), String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), U.n(e.kg), u, (e.tags || []).join('|'), e.note || '']); });
  return rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n';
}
async function exportCSV(){
  if (!S.entries.length) { toast('Nothing to export yet.'); return; }
  const data = buildCSV(), filename = 'momentum-weights-' + todayKey() + '.csv';
  try {
    const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl) { const r = await dl.save({filename, data}); if (r) { toast(r.status === 'saved' ? 'CSV saved.' : 'CSV ready.'); return; } }
  } catch (e) { if (e && e.code === 'declined') return; }
  try {
    const url = URL.createObjectURL(new Blob([data], {type:'text/csv'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('CSV downloaded.');
  } catch (e) { toast('Could not export on this device.'); }
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function importCSV(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const rows = parseCSV(String(fr.result || ''));
      if (!rows.length) throw new Error('empty');
      let hdr = rows[0].map(h => h.trim().toLowerCase());
      let body = rows.slice(1);
      if (!hdr.includes('weight') && !hdr.includes('date')) { hdr = ['date','time','weight','unit','tags','note']; body = rows; }
      const ix = n => hdr.findIndex(h => h === n || h.startsWith(n));
      const iD = ix('date'), iT = ix('time'), iW = ix('weight'), iU = ix('unit'), iG = ix('tags'), iN = ix('note');
      // duplicate = same minute and same weight within export rounding (0.1 lb or 0.1 kg)
      const existing = new Map();
      const isDup = (min, kg) => (existing.get(min) || []).some(x => Math.abs(x - kg) < 0.051);
      const remember = (min, kg) => { if (!existing.has(min)) existing.set(min, []); existing.get(min).push(kg); };
      S.entries.forEach(e => remember(Math.floor(e.t / 60000), e.kg));
      const add = []; let skipped = 0;
      body.forEach(r => {
        const dk = (r[iD] || '').trim();
        let d = isValidKey(dk) ? fromKey(dk) : new Date(dk);
        const w = parseNum(r[iW]);
        if (isNaN(d) || !isFinite(w)) { skipped++; return; }
        if (iT >= 0 && r[iT]) { const hm = r[iT].trim().split(':').map(Number); if (isFinite(hm[0])) d.setHours(hm[0], hm[1] || 0, 0, 0); }
        const unit = iU >= 0 && /kg/i.test(r[iU] || '') ? 'kg' : iU >= 0 && /lb/i.test(r[iU] || '') ? 'lb' : U.unit;
        const kg = U.from(w, unit);
        if (kg < 20 || kg > 400) { skipped++; return; }
        const min = Math.floor(d.getTime() / 60000);
        if (isDup(min, kg)) { skipped++; return; }
        remember(min, kg);
        add.push({id:uid(), kg, t:d.getTime(), tags: iG >= 0 && r[iG] ? r[iG].split('|').map(s => s.trim()).filter(Boolean).slice(0, 8) : [], note: iN >= 0 ? (r[iN] || '').slice(0, 280) : '', updatedAt:Date.now()});
      });
      if (!add.length) { toast('No new weigh-ins found in that file.'); return; }
      Store.bulkAdd(add);
      const np = Object.assign({}, S.profile);
      np.celebrated = Array.from(new Set((np.celebrated || []).concat(earnedIds(analyze(np, S.entries)))));
      Store.setProfile(np);
      closeLayer();
      toast('Imported ' + add.length + ' weigh-in' + (add.length === 1 ? '' : 's') + (skipped ? ', skipped ' + skipped : '') + '.');
    } catch (e) { toast('That file could not be read as CSV.'); }
  };
  fr.readAsText(file);
}

  layer.innerHTML = '<div class="celebrate" role="dialog" aria-modal="true" aria-labelledby="ce-h"><div class="confetti" aria-hidden="true">' + conf + '</div>' +
    '<div class="cele-card">' + medalSVG(true, m.kind) + '<div class="eyebrow" style="color:var(--warm-text)">Milestone unlocked</div><h2 id="ce-h">' + esc(m.title) + '</h2><p>' + esc(sub) + '</p>' +
    '<button class="btn block" type="button" data-act="close" autofocus>Keep going</button></div></div>';
  setTimeout(() => { const b = layer.querySelector('[autofocus]'); if (b) b.focus(); }, 30);
}

/* =====================================================================
   Onboarding
   ===================================================================== */
function renderOnboarding(root){
  const o = UI.onb, step = o.step;
  const u = o.unit;
  const dots = '<div class="onb-steps" aria-hidden="true">' + [0,1,2].map(i => '<i class="' + (i <= step ? 'on' : '') + '"></i>').join('') + '</div>';
  let body = '';
  if (step === 0) {
    body = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">' + LOGO + '<span style="font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:18px">Momentum</span></div>' +
      '<h1>See your progress. Feel your momentum.</h1><p class="lead">Log your weight as often as you like. Momentum turns it into a calm trend, honest stats and milestones worth celebrating.</p>' +
      '<div class="stack"><div class="field"><label for="ob-name">What should we call you? <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input class="input" id="ob-name" autocomplete="given-name" maxlength="40" value="' + esc(o.name) + '"></div>' +
      '<div class="field"><span class="flabel" id="ob-u">Units</span><div class="seg" role="group" aria-labelledby="ob-u" style="align-self:flex-start">' + ['lb','kg'].map(x => '<button type="button" data-act="ob-unit" data-v="' + x + '" aria-pressed="' + (u === x) + '">' + (x === 'lb' ? 'Pounds (lb)' : 'Kilograms (kg)') + '</button>').join('') + '</div></div></div>';
  } else if (step === 1) {
    body = dots + '<h1>Where are you now, and where are you headed?</h1><p class="lead">Your current weight becomes your first weigh-in and the start of your journey.</p>' +
      '<div class="form-grid"><div class="field"><label for="ob-cur">Current weight</label><div class="input-wrap"><input class="input" id="ob-cur" inputmode="decimal" autocomplete="off" value="' + esc(o.current) + '" placeholder="' + (u === 'lb' ? '212.0' : '96.0') + '"><span class="suffix">' + u + '</span></div></div>' +
      '<div class="field"><label for="ob-goal">Goal weight</label><div class="input-wrap"><input class="input" id="ob-goal" inputmode="decimal" autocomplete="off" value="' + esc(o.goal) + '" placeholder="' + (u === 'lb' ? '180.0' : '82.0') + '"><span class="suffix">' + u + '</span></div></div></div>' +
      '<p class="err" id="ob-err" role="alert"></p>';
  } else {
    const cur = parseNum(o.current), goal = parseNum(o.goal), rem = Math.abs(cur - goal);
    body = dots + '<h1>Choose a pace that feels sustainable</h1><p class="lead">You can change this any time. Slow and steady usually wins.</p>' +
      '<div class="stack"><div class="field"><span class="flabel" id="ob-p">Weekly pace</span><div class="pace-opts" role="group" aria-labelledby="ob-p">' +
      PACES[u].map(v => '<button type="button" class="pace-opt" data-act="ob-pace" data-v="' + v + '" aria-pressed="' + (o.pace === v) + '"><b>' + v + '</b><span>' + u + '/wk<br>' + fmtD(addDays(todayKey(), Math.ceil(rem / v * 7)), {month:'short', year:'numeric'}) + '</span></button>').join('') + '</div></div>' +
      '<div class="field"><label for="ob-target">Target date <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input class="input" type="date" id="ob-target" min="' + addDays(todayKey(), 1) + '" value="' + esc(o.target) + '"></div>' +
      '<div class="motive" id="ob-sum"></div></div>';
  }
  root.innerHTML = '<div class="onb"><div class="onb-card">' + (step === 0 ? '' : '') + body +
    '<div class="onb-foot">' + (step > 0 ? '<button class="btn secondary" type="button" data-act="ob-back">' + ic('back', 'sm') + 'Back</button>' : '') +
    '<button class="btn" type="button" data-act="ob-next">' + (step === 2 ? 'Start my journey' : 'Continue') + (step < 2 ? ic('next', 'sm') : '') + '</button></div></div></div>';
  if (step === 2) { obSummary(); $('#ob-target').addEventListener('input', ev => { UI.onb.target = ev.target.value; obSummary(); }); }
  const first = root.querySelector('input'); if (first && step === 1) first.focus();
}
function obSummary(){
  const o = UI.onb, el = $('#ob-sum'); if (!el) return;
  const cur = parseNum(o.current), goal = parseNum(o.goal), rem = Math.abs(cur - goal);
  const k = addDays(todayKey(), Math.ceil(rem / o.pace * 7));
  let t = 'At <b>' + o.pace + ' ' + o.unit + '/week</b> you reach <b>' + goal.toFixed(1) + ' ' + o.unit + '</b> around <b>' + fmtDY(k) + '</b>, ' + Math.ceil(rem / o.pace) + ' weeks from today.';
  if (o.target && isValidKey(o.target) && o.target > todayKey()) { const need = rem / diffDays(todayKey(), o.target) * 7; t += ' Reaching it by ' + fmtDY(o.target) + ' means about <b>' + need.toFixed(1) + ' ' + o.unit + '/week</b>.'; }
  el.innerHTML = t;
}
function obCapture(){
  const o = UI.onb;
  const n = $('#ob-name'); if (n) o.name = n.value.trim().slice(0, 40);
  const c = $('#ob-cur'); if (c) o.current = c.value.trim();
  const g = $('#ob-goal'); if (g) o.goal = g.value.trim();
  const t = $('#ob-target'); if (t) o.target = t.value;
}
function obNext(){
  obCapture();
  const o = UI.onb;
  if (o.step === 1) {
    const c = parseNum(o.current), g = parseNum(o.goal), err = $('#ob-err');
    const lo = o.unit === 'lb' ? 44 : 20, hi = o.unit === 'lb' ? 880 : 400;
    if (!isFinite(c) || c < lo || c > hi) { err.textContent = 'Enter your current weight in ' + o.unit + '.'; $('#ob-cur').focus(); return; }
    if (!isFinite(g) || g < lo || g > hi) { err.textContent = 'Enter a goal weight in ' + o.unit + '.'; $('#ob-goal').focus(); return; }
    if (Math.abs(c - g) < 0.5) { err.textContent = 'Your goal should be at least 0.5 ' + o.unit + ' from where you are now.'; return; }
  }
  if (o.step < 2) { o.step++; renderOnboarding($('#root')); return; }
  const unit = o.unit, cur = U.from(parseNum(o.current), unit), goal = U.from(parseNum(o.goal), unit);
  const now = Date.now();
  const profile = {name:o.name, unit, theme:currentTheme(), startKg:cur, startDate:todayKey(), goalKg:goal, targetDate: o.target && o.target > todayKey() ? o.target : null, paceKg:U.from(o.pace, unit), celebrated:[], createdAt:now, updatedAt:now};
  S.profile = profile;
  Store.setProfile(profile);
  Store.upsertEntry({kg:cur, t:now, tags: new Date().getHours() < 11 ? ['Morning'] : [], note:'Day one'});
  location.hash = '#today';
  render();
  toast('Welcome' + (o.name ? ', ' + o.name : '') + '. Your journey starts today.');
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) {
    if (ev.target.matches && ev.target.matches('[data-scrim]')) closeLayer();
    return;
  }
  const act = el.dataset.act, v = el.dataset.v;
  switch (act) {
    case 'log': openLog(); break;
    case 'edit': openLog(el.dataset.id); break;
    case 'close': closeLayer(); break;
    case 'settings': openSettings(); break;
    case 'range': UI.range = v; $$('[data-act="range"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); drawTrendChart($('#trend-chart')); break;
    case 'hl-next': nextHeadline(); setupHeadlineRotation(); break;
    case 'step': { const i = $('#lg-w'); const n = parseNum(i.value); i.value = ((isFinite(n) ? n : 0) + parseFloat(v)).toFixed(1); break; }
    case 'tag': el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')); break;
    case 'delete': {
      const gone = Store.deleteEntry(el.dataset.id); closeLayer();
      if (gone) toast('Weigh-in deleted.', 'Undo', () => { Store.upsertEntry(gone); toast('Restored.'); });
      break;
    }
    case 'export': exportCSV(); break;
    case 'reset': confirmDialog('Reset all data?', 'This permanently deletes your goal and all ' + S.entries.length + ' weigh-ins. Consider exporting a CSV first.', 'Delete everything', async () => { UI.onb = {step:0, name:'', unit:'lb', current:'', goal:'', target:'', pace:1}; await Store.resetAll(); location.hash = ''; render(); }); break;
    case 'theme': applyTheme(v); Store.setProfile(Object.assign({}, S.profile, {theme:v})); $$('[data-act="theme"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); break;
    case 'unit': setUnit(v); $$('[data-act="unit"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); break;
    case 'g-unit': setUnit(v); break;
    case 'g-pace': $$('.pace-opt').forEach(b => b.setAttribute('aria-pressed', String(b === el))); goalPreview(); break;
    case 'more': UI.histDays += 30; render(); break;
    case 'heat': { const t = $('#day-' + el.dataset.k); if (t) { t.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'start'}); } else { const a = analysis(); const i = a.days.slice().reverse().findIndex(d => d.key === el.dataset.k); if (i >= 0) { UI.histDays = i + 10; render(); const t2 = $('#day-' + el.dataset.k); if (t2) t2.scrollIntoView({block:'start'}); } else toast('No weigh-ins on ' + fmtD(el.dataset.k) + '.'); } break; }
    case 'ob-unit': { obCapture(); const o = UI.onb; if (o.unit !== v) { const i = PACES[o.unit].indexOf(o.pace); o.pace = PACES[v][i >= 0 ? i : 1]; ['current','goal'].forEach(f => { const n = parseNum(o[f]); if (isFinite(n)) o[f] = U.to(U.from(n, o.unit), v).toFixed(1); }); o.unit = v; } renderOnboarding($('#root')); break; }
    case 'ob-pace': UI.onb.pace = +v; $$('[data-act="ob-pace"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); obSummary(); break;
    case 'ob-next': obNext(); break;
    case 'ob-back': obCapture(); UI.onb.step = Math.max(0, UI.onb.step - 1); renderOnboarding($('#root')); break;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && $('.onb') && ev.target.tagName === 'INPUT') { ev.preventDefault(); obNext(); }
});
window.addEventListener('hashchange', () => { closeLayer(); render(); const m = $('#main'); if (m) m.focus({preventScroll:true}); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.profile) render(); }); } catch (e) {}

/* =====================================================================
   Boot
   ===================================================================== */
Store.load();
if (S.profile && S.profile.theme) applyTheme(S.profile.theme);
Store.onChange(() => {
  // Avoid wiping an open goal form or an open sheet's context unnecessarily
  if ($('#layer').firstChild && $('.onb')) return;
  render();
});
render();
// Day rollover: refresh at midnight-ish
let lastDay = todayKey();
setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); S.v++; render(); } }, 60000);
// Connect to per-viewer storage without blocking first paint
setTimeout(() => { Store.connect(); }, 0);
})();
</script>
</body>
</html>
