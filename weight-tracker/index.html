<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum</title>
<meta name="description" content="Momentum: a weight tracker that shows your progress toward your goal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script>
  (function(){try{var t=localStorage.getItem('momentum.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{
  --bg:#F4F5FA;--surface:#FFFFFF;--surface-2:#F7F8FC;--ink:#0D1124;--ink-2:#4A5168;--muted:#6B7287;--line:#E6E8F0;
  --brand:#5B4DF5;--brand-ink:#5B4DF5;--brand-soft:#EEEBFF;--brand-deep:#3B2FD1;--on-brand:#FFFFFF;
  --good:#0A7F5A;--good-fill:#12B886;--good-soft:#E3F6EE;
  --warm:#E05A1B;--warm-text:#B9470F;--warm-soft:#FFF0E6;
  --amber:#F2A65A;--amber-text:#8F4E0B;--amber-soft:#FFF3E3;
  --danger:#B4233D;--danger-soft:#FDECEF;
  --hero:#14163A;--hero-ink:#FFFFFF;--hero-2:#B9BCE0;--hero-accent:#8F85FF;--hero-track:rgba(255,255,255,.14);--hero-border:transparent;
  --dot:#A3A8C3;--trend-fill:rgba(91,77,245,.10);--grid:#E6E8F0;
  --heat0:#ECEEF5;--heat1:#D6D1FF;--heat2:#9D93FA;--heat3:#5B4DF5;--heat-ink:#0D1124;--heat-ink-strong:#FFFFFF;
  --shadow:0 1px 2px rgba(13,17,36,.04),0 8px 24px rgba(13,17,36,.06);
  --shadow-lg:0 2px 6px rgba(13,17,36,.08),0 24px 60px rgba(13,17,36,.18);
  --scrim:rgba(13,17,36,.42);--toast-act:#C4BEFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C18;--surface:#14172A;--surface-2:#1A1E34;--ink:#EDEFF8;--ink-2:#B4B8CE;--muted:#959AB2;--line:#272B43;
    --brand:#5B4DF5;--brand-ink:#A39BFF;--brand-soft:#232050;--brand-deep:#C7C1FF;--on-brand:#FFFFFF;
    --good:#4FD6A4;--good-fill:#12B886;--good-soft:#11332A;
    --warm:#F06A2A;--warm-text:#FF9F6B;--warm-soft:#38200F;
    --amber:#F2A65A;--amber-text:#F7BE82;--amber-soft:#36260F;
    --danger:#FF8197;--danger-soft:#3A1822;
    --hero:#191C47;--hero-ink:#FFFFFF;--hero-2:#BEC1E6;--hero-accent:#9D94FF;--hero-track:rgba(255,255,255,.13);--hero-border:#2C3070;
    --dot:#5D6282;--trend-fill:rgba(143,133,255,.13);--grid:#252941;
    --heat0:#1E2238;--heat1:#2F2B6C;--heat2:#4B41C4;--heat3:#9D94FF;--heat-ink:#EDEFF8;--heat-ink-strong:#0D1124;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
    --scrim:rgba(3,4,12,.62);--toast-act:#3B2FD1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0A0C18;--surface:#14172A;--surface-2:#1A1E34;--ink:#EDEFF8;--ink-2:#B4B8CE;--muted:#959AB2;--line:#272B43;
    --brand:#5B4DF5;--brand-ink:#A39BFF;--brand-soft:#232050;--brand-deep:#C7C1FF;--on-brand:#FFFFFF;
    --good:#4FD6A4;--good-fill:#12B886;--good-soft:#11332A;
    --warm:#F06A2A;--warm-text:#FF9F6B;--warm-soft:#38200F;
    --amber:#F2A65A;--amber-text:#F7BE82;--amber-soft:#36260F;
    --danger:#FF8197;--danger-soft:#3A1822;
    --hero:#191C47;--hero-ink:#FFFFFF;--hero-2:#BEC1E6;--hero-accent:#9D94FF;--hero-track:rgba(255,255,255,.13);--hero-border:#2C3070;
    --dot:#5D6282;--trend-fill:rgba(143,133,255,.13);--grid:#252941;
    --heat0:#1E2238;--heat1:#2F2B6C;--heat2:#4B41C4;--heat3:#9D94FF;--heat-ink:#EDEFF8;--heat-ink-strong:#0D1124;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
    --scrim:rgba(3,4,12,.62);--toast-act:#3B2FD1;
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:Manrope,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-ink)}
.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:18px;height:18px}
svg.ic.xs{width:16px;height:16px}

/* ---------- shell ---------- */
.shell{min-height:100vh}
.sidenav{display:none}
.content{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 4px;max-width:1100px;margin:0 auto}
.brandmark{display:flex;align-items:center;gap:10px;font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo{width:34px;height:34px;border-radius:11px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.iconbtn.ghost{border-color:transparent;background:transparent}
main{padding:8px 20px calc(110px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 16px}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid-2{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow);min-width:0;position:relative}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h2{font-size:17px;font-weight:800}
.card-sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600;border-radius:14px}
.tab[aria-current="page"]{color:var(--brand-ink)}
.tab-plus{display:flex;justify-content:center}
.plusbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(91,77,245,.38);transform:translateY(-14px)}
.plusbtn svg{width:26px;height:26px;stroke-width:2.2}
.plusbtn:hover{background:var(--brand-deep)}
:root[data-theme="dark"] .plusbtn:hover{background:#4C3FE6}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:16px;border:1px solid transparent;font-weight:600;font-size:15px;background:var(--brand);color:var(--on-brand);text-decoration:none;white-space:nowrap}
.btn:hover{background:#4A3CE6}
.btn.block{width:100%;min-height:52px;font-size:16px}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{background:var(--surface-2)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn.soft:hover{filter:brightness(.97)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger.solid{background:#B4233D;color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:36px;min-width:44px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(13,17,36,.12)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#2A2F4D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#2A2F4D}}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--amber-soft);color:var(--amber-text)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.warm{background:var(--warm-soft);color:var(--warm-text)}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}

/* headline */
.greet{color:var(--muted);font-size:14px;font-weight:500;margin:6px 0 4px}
.headline{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.headline-text{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:24px;line-height:1.22;letter-spacing:-.02em;margin:0;min-height:2.44em;transition:opacity .35s ease}
.headline-text .hl{color:var(--brand-ink)}
.headline-text.fade{opacity:0}
.hl-dots{display:flex;gap:6px;align-items:center;margin-top:8px}
.hl-dots span{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .3s,background .3s}
.hl-dots span.on{width:18px;background:var(--brand-ink)}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:22px 20px 20px;box-shadow:var(--shadow);border:1px solid var(--hero-border);overflow:hidden}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero .label{font-size:13px;color:var(--hero-2);font-weight:500;display:flex;align-items:center;gap:6px}
.big{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:8px 0 10px}
.big small{font-size:20px;font-weight:700;color:var(--hero-2);margin-left:4px;letter-spacing:0}
.hero .delta{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:rgba(18,184,134,.18);color:#7DEBC2}
.hero .delta.away{background:rgba(242,166,90,.18);color:#FFC58C}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .ring-txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .ring-txt b{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:24px;display:block;font-variant-numeric:tabular-nums}
.ring .ring-txt span{font-size:11.5px;color:var(--hero-2)}
.journey{margin-top:20px}
.jbar{position:relative;height:10px;border-radius:99px;background:var(--hero-track)}
.jbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--hero-accent)}
.jbar .now{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--hero-accent);transform:translate(-50%,-50%)}
.jbar .goalflag{position:absolute;right:0;top:50%;width:14px;height:14px;border-radius:50%;background:var(--warm);border:3px solid var(--hero);transform:translate(40%,-50%)}
.jlabels{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--hero-2);gap:8px}
.jlabels b{display:block;color:#fff;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.jlabels .mid{text-align:center}
.jlabels .end{text-align:right}
.hero-foot{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero-chip{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 12px;font-size:13px;color:var(--hero-2);flex:1 1 130px}
.hero-chip b{display:block;color:#fff;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* chart */
.chart{position:relative;width:100%;min-height:200px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.chart-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px;color:var(--ink-2)}
.chart-empty b{font-family:Manrope,Inter,system-ui,sans-serif;font-size:17px;color:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.35;white-space:nowrap;box-shadow:var(--shadow-lg);transform:translate(-50%,-100%);z-index:3;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:7px;height:7px;border-radius:50%;background:var(--dot)}
.lg-line{width:16px;height:3px;border-radius:2px;background:var(--brand-ink)}
.lg-dash{width:16px;height:0;border-top:2px dashed var(--warm)}
.lg-dash.brand{border-color:var(--brand-ink)}
.lg-dash.muted{border-top-style:dotted;border-color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.tile .t-label{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .t-val{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t-val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:0}
.tile .t-sub{font-size:12.5px;color:var(--ink-2)}
.t-good{color:var(--good)}.t-bad{color:var(--amber-text)}.t-warm{color:var(--warm-text)}.t-brand{color:var(--brand-ink)}
.tile .ticon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.ticon.good{background:var(--good-soft);color:var(--good)}
.ticon.brand{background:var(--brand-soft);color:var(--brand-ink)}
.ticon.warm{background:var(--warm-soft);color:var(--warm-text)}
.ticon.neutral{background:var(--surface-2);color:var(--ink-2)}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px;min-height:56px;width:100%;border:0;background:transparent;text-align:left}
button.row:hover{background:var(--surface-2)}
.row+.row{border-top:1px solid var(--line)}
.list .row{border-radius:0}
main:focus{outline:none}
.row .when{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;min-width:74px}
.row .meta{flex:1;min-width:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .w{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .w small{font-size:12px;color:var(--muted);font-weight:700;margin-left:2px}
.tagmini{display:inline-block;background:var(--brand-soft);color:var(--brand-ink);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;margin-right:4px}
.empty{text-align:center;padding:18px 8px;color:var(--ink-2)}
.empty b{display:block;font-family:Manrope,Inter,system-ui,sans-serif;font-size:16px;color:var(--ink);margin-bottom:4px}

/* insights */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bigstat{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bigstat small{font-size:18px;color:var(--muted);margin-left:4px;letter-spacing:0}
.callout{display:flex;gap:14px;align-items:flex-start}
.callout .ticon{width:40px;height:40px;border-radius:14px}
.callout h3{font-size:16px;font-weight:800;margin-bottom:2px}
.callout p{margin:0;color:var(--ink-2);font-size:14px}
.pattern-grid{display:grid;grid-template-columns:1fr;gap:12px}
.pattern{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:16px}
.pattern .p-val{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;margin:4px 0}
.pattern p{margin:0;font-size:13.5px;color:var(--ink-2)}
.weekbars{margin-top:4px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{display:flex;gap:14px;align-items:flex-start;padding:0 0 18px;position:relative}
.timeline li::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;z-index:1}
.timeline .node.done{background:var(--warm-soft);color:var(--warm-text)}
.timeline .node.next{background:var(--brand-soft);color:var(--brand-ink);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--brand-ink)}
.timeline .node.todo{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.timeline .tl-t{font-weight:600;font-size:14.5px}
.timeline .tl-s{font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border-radius:18px;padding:14px 12px;text-align:center;border:1px solid var(--line);background:var(--surface-2)}
.badge .medal{width:52px;height:52px;margin:0 auto 8px;display:block}
.badge b{display:block;font-size:13.5px;font-weight:600}
.badge span{font-size:12px;color:var(--muted)}
.badge.earned{background:var(--warm-soft);border-color:transparent}
.badge.earned span{color:var(--warm-text)}

/* history */
.heat{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.heat .hd{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.heat .mo{font-size:11.5px;color:var(--muted);font-weight:600;padding-right:6px;white-space:nowrap;min-width:28px}
.hcell{aspect-ratio:1;max-height:42px;border-radius:9px;border:0;background:var(--heat0);color:var(--muted);font-size:11.5px;font-weight:600;display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums;min-width:0;width:100%}
.hcell.l1{background:var(--heat1);color:var(--heat-ink)}
.hcell.l2{background:var(--heat2);color:#fff}
.hcell.l3{background:var(--heat3);color:var(--heat-ink-strong)}
.hcell.future{background:transparent;color:transparent;pointer-events:none}
.hcell.today{box-shadow:0 0 0 2px var(--warm)}
.heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:12px;color:var(--muted);margin-top:12px}
.heat-legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.dayblock{padding:4px 0}
.dayhead{display:flex;align-items:center;gap:10px;padding:14px 4px 8px;flex-wrap:wrap}
.dayhead h3{font-size:15px;font-weight:800;flex:1;min-width:120px}
.dayhead .avg{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.rangebar{position:relative;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin:0 4px 6px}
.rangebar i{position:absolute;top:-1px;bottom:-1px;border-radius:99px;background:var(--brand-soft);border:2px solid var(--brand-ink);min-width:8px}
.rangebar em{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--brand-ink);transform:translate(-50%,-50%);border:2px solid var(--surface)}
.rangecap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin:0 4px 4px;font-variant-numeric:tabular-nums}

/* goal */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.input:focus{outline:none;border-color:var(--brand-ink);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{padding:12px 14px;min-height:72px;resize:vertical}
.input-wrap{position:relative}
.input-wrap .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.help{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--danger);min-height:0}
.pace-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pace-opt{border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:10px 6px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pace-opt b{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.pace-opt span{font-size:11.5px;color:var(--muted);text-align:center}
.pace-opt[aria-pressed="true"]{border-color:var(--brand-ink);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand-ink) inset}
.pace-opt[aria-pressed="true"] span{color:var(--brand-ink)}
.motive{background:var(--brand-soft);color:var(--ink);border-radius:18px;padding:14px 16px;font-size:14.5px}
.motive b{color:var(--brand-ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
.scrim.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheet-head h2{font-size:20px;font-weight:800}
.weigh{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 16px}
.weigh .stepbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.weigh-in{display:flex;align-items:baseline;justify-content:center;border-bottom:2px solid var(--line);padding:0 4px;min-width:0}
.weigh-in:focus-within{border-color:var(--brand-ink)}
.weigh-in input{border:0;background:transparent;font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:56px;letter-spacing:-.02em;width:4.2ch;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;min-width:0}
.weigh-in input:focus{outline:none}
.weigh-in input::selection{background:var(--brand-soft);color:var(--brand-ink)}
.weigh-in span{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:700;font-size:20px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-ink);color:var(--brand-ink)}
.sheet .section{margin-top:16px}
.sheet .btns{display:flex;gap:10px;margin-top:20px}
.sheet .btns .btn{flex:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-of-type{border-top:0}
.setrow .flabel{font-size:14.5px;color:var(--ink)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow-lg);max-width:calc(100vw - 40px);font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:transparent;border:0;color:var(--toast-act);font-weight:700;min-height:40px;padding:0 10px;border-radius:10px}

/* celebrate */
.celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--scrim);padding:20px;overflow:hidden}
.cele-card{background:var(--surface);border-radius:28px;padding:28px 24px 22px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow-lg);position:relative;z-index:2;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.cele-card svg.medal{width:132px;height:132px;display:block;margin:0 auto 8px}
.cele-card h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.cele-card p{color:var(--ink-2);margin:6px 0 18px}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-20px;display:block;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
  .confetti{display:none}
}

/* onboarding */
.onb{min-height:100vh;display:grid;place-items:center;padding:24px 20px}
.onb-card{width:100%;max-width:480px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:28px 22px}
.onb-steps{display:flex;gap:6px;margin-bottom:22px}
.onb-steps i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.onb-steps i.on{background:var(--brand)}
.onb h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.onb .lead{color:var(--ink-2);margin:8px 0 22px}
.onb .stack{gap:14px}
.onb-foot{display:flex;gap:10px;margin-top:24px}
.onb-foot .btn{flex:1}

/* confirm dialog */
.dialog{background:var(--surface);border-radius:24px;padding:22px;max-width:400px;width:calc(100% - 40px);box-shadow:var(--shadow-lg);margin:auto}
.dialog h2{font-size:20px;font-weight:800}
.dialog p{color:var(--ink-2)}
.scrim.center{align-items:center}

/* desktop */
@media (min-width:900px){
  .tabbar{display:none}
  .sidenav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:248px;padding:24px 16px;background:var(--surface);border-right:1px solid var(--line);z-index:20}
  .sidenav .brandmark{padding:4px 10px 26px}
  .navlink{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:15px}
  .navlink:hover{background:var(--surface-2);color:var(--ink)}
  .navlink[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
  .sidenav .btn{margin:14px 0 8px}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
  .side-foot .navlink{border:0;background:transparent;width:100%;text-align:left}
  .content{margin-left:248px}
  .topbar{display:none}
  main{padding:28px 40px 48px}
  .page-head h1{font-size:32px}
  .grid-2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
  .grid-2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .headline-text{font-size:30px;min-height:1.22em}
  .big{font-size:64px}
  .hero{padding:26px 26px 22px}
  .ring,.ring svg{width:124px;height:124px}
  .statgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pattern-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .scrim{align-items:center}
  .sheet{border-radius:24px;padding:16px 24px 24px}
  .sheet .grab{display:none}
  .toast{bottom:32px}
}
@media (max-width:380px){
  .big{font-size:44px}
  .ring,.ring svg{width:92px;height:92px}
  .ring .ring-txt b{font-size:20px}
  .headline-text{font-size:21px}
  .tile .t-val{font-size:21px}
  .pace-opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-act" hidden>Undo</button></div>

<script>
(function(){
'use strict';

/* =====================================================================
   Utilities
   ===================================================================== */
const LB = 0.45359237;
const DAY = 864e5;
const KEY = 'momentum.v1';
const THEME_KEY = 'momentum.theme';
const TAGS = ['Morning','After workout','Before bed','After meal'];
// weekly pace choices per unit; kg options mirror the lb ones so switching units round-trips
const PACES = {lb:[0.5, 1, 1.5, 2], kg:[0.25, 0.5, 0.75, 1]};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

function keyOf(t){ const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(k, n){ const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
function diffDays(a, b){ return Math.round((fromKey(b) - fromKey(a)) / DAY); }
function todayKey(){ return keyOf(Date.now()); }
function weekStartKey(k){ const d = fromKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return keyOf(d); }
const fmtD = (k, o) => fromKey(k).toLocaleDateString('en-US', o || {month:'short', day:'numeric'});
const fmtDY = k => { const sameYear = fromKey(k).getFullYear() === new Date().getFullYear(); return fmtD(k, sameYear ? {month:'short', day:'numeric'} : {month:'short', day:'numeric', year:'numeric'}); };
const fmtTime = t => new Date(t).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function relDay(k){ const t = todayKey(); if (k === t) return 'Today'; if (k === addDays(t, -1)) return 'Yesterday'; return fmtD(k, {weekday:'short', month:'short', day:'numeric'}); }
function isValidKey(k){ return /^\d{4}-\d{2}-\d{2}$/.test(k || '') && !isNaN(fromKey(k)); }

/* =====================================================================
   Units & formatting (canonical storage: kilograms)
   ===================================================================== */
const U = {
  get unit(){ return (S.profile && S.profile.unit) || 'lb'; },
  to(kg, unit){ return (unit || U.unit) === 'lb' ? kg / LB : kg; },
  from(v, unit){ return (unit || U.unit) === 'lb' ? v * LB : v; },
  n(kg){ return U.to(kg).toFixed(1); },
  w(kg){ return U.n(kg) + ' ' + U.unit; },
  abs(kgDelta){ return Math.abs(U.to(kgDelta)).toFixed(1); },
  signed(kgDelta){ const v = U.to(kgDelta); const r = Math.abs(v) < 0.05 ? 0 : v; return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(1); },
  paces(unit){ const u = unit || U.unit; return PACES[u].map(v => ({v, kg: U.from(v, u)})); }
};
function parseNum(s){ const v = parseFloat(String(s).replace(',', '.').trim()); return isFinite(v) ? v : NaN; }

/* =====================================================================
   Icons
   ===================================================================== */
const ICONS = {
  today:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',
  insights:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  history:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  goal:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5h10L18 7M9 7V4h6v3"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',
  upload:'<path d="M12 20V9M7 14l5-5 5 5M4 4h16"/>',
  next:'<path d="M9 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  flame:'<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.4 2.4-5.4 3.6-8.3.5 2 1.6 3.1 2.6 3.6C12 6.8 13.2 4.6 14.9 3c.3 3 4.6 5.9 4.6 11.4 0 3.9-3 6.6-7.5 6.6z"/>',
  trophy:'<path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 14v3M8.5 20h7M9.5 17h5"/>',
  down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  scale:'<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8.5 9.5a5 5 0 0 1 7 0"/><path d="M12 12.5l1.5-2.5"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  wave:'<path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  edit:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'
};
const ic = (n, cls) => '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[n] + '</svg>';
const LOGO = '<span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 4 7-8"/><path d="M15 7h5v5"/></svg></span>';

/* =====================================================================
   Store: localStorage cache + optional claude db (per-viewer private)
   ===================================================================== */
const S = { profile: null, entries: [], syncedIds: [], v: 0 };
const Store = {
  remote: null, resetting: false, pendingUp: new Map(), pendingDel: new Set(), firstEntries: true, listeners: [],
  load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d === 'object') {
          S.profile = d.profile && typeof d.profile === 'object' ? d.profile : null;
          S.entries = Array.isArray(d.entries) ? d.entries.filter(validEntry) : [];
          S.syncedIds = Array.isArray(d.syncedIds) ? d.syncedIds : [];
        }
      }
    } catch (e) {}
  },
  saveLocal(){
    try { localStorage.setItem(KEY, JSON.stringify({v:1, profile:S.profile, entries:S.entries, syncedIds:S.syncedIds})); } catch (e) {}
  },
  changed(){ S.v++; this.saveLocal(); this.listeners.forEach(f => { try { f(); } catch (e) { console.warn(e); } }); },
  onChange(f){ this.listeners.push(f); },

  setProfile(p, silent){
    S.profile = Object.assign({}, p, {updatedAt: Date.now()});
    this.changed();
    if (this.remote) this.remote.profileRef.set(cleanProfile(S.profile)).catch(e => syncError(e));
  },
  upsertEntry(e){
    const entry = {id:e.id || uid(), kg:+e.kg, t:+e.t, tags:Array.isArray(e.tags) ? e.tags.slice(0, 8) : [], note:String(e.note || '').slice(0, 280), updatedAt:Date.now()};
    const i = S.entries.findIndex(x => x.id === entry.id);
    if (i >= 0) S.entries[i] = entry; else S.entries.push(entry);
    this.changed();
    if (this.remote) {
      this.pendingUp.set(entry.id, entry); this.pendingDel.delete(entry.id);
      this.remote.col.doc(entry.id).set(entry).then(() => { this.pendingUp.delete(entry.id); }).catch(err => { this.pendingUp.delete(entry.id); syncError(err); });
    }
    return entry;
  },
  deleteEntry(id){
    const i = S.entries.findIndex(x => x.id === id);
    if (i < 0) return null;
    const [gone] = S.entries.splice(i, 1);
    this.changed();
    if (this.remote) {
      this.pendingDel.add(id); this.pendingUp.delete(id);
      this.remote.col.doc(id).delete().then(() => { this.pendingDel.delete(id); }).catch(err => { this.pendingDel.delete(id); syncError(err); });
    }
    return gone;
  },
  bulkAdd(list){
    list.forEach(e => S.entries.push(e));
    this.changed();
    if (this.remote) list.forEach(e => { this.pendingUp.set(e.id, e); this.remote.col.doc(e.id).set(e).then(() => this.pendingUp.delete(e.id)).catch(err => { this.pendingUp.delete(e.id); syncError(err); }); });
  },
  async resetAll(){
    const ids = S.entries.map(e => e.id);
    S.profile = null; S.entries = []; S.syncedIds = [];
    this.changed();
    if (this.remote) {
      this.resetting = true;
      try {
        const snap = await this.remote.col.get();
        await Promise.all(snap.docs.map(d => this.remote.col.doc(d.id).delete()).concat(ids.map(id => this.remote.col.doc(id).delete())));
        await this.remote.profileRef.delete();
      } catch (e) { syncError(e); }
      this.resetting = false;
      S.entries = []; S.profile = null; this.changed();
    }
  },

  async connect(){
    try {
      const c = window.claude;
      if (!c || typeof c.use !== 'function') return;
      const [db, user] = await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const profileRef = db.doc('data/users/' + id + '/profile');
      const col = profileRef.collection('entries');
      this.remote = {profileRef, col};
      profileRef.onSnapshot(snap => this.onProfileSnap(snap), e => console.warn('profile sync', e && e.code));
      col.onSnapshot(snap => this.onEntriesSnap(snap), e => console.warn('entries sync', e && e.code));
    } catch (e) { this.remote = null; }
  },
  onProfileSnap(snap){
    if (this.resetting) return;
    if (snap.exists) {
      const rp = snap.data() || {};
      const lp = S.profile;
      if (!lp || (rp.updatedAt || 0) >= (lp.updatedAt || 0)) {
        if (JSON.stringify(cleanProfile(rp)) !== JSON.stringify(lp ? cleanProfile(lp) : null)) {
          S.profile = rp; if (rp.theme) applyTheme(rp.theme, true); this.changed();
        }
      } else {
        this.remote.profileRef.set(cleanProfile(lp)).catch(e => syncError(e));
      }
    } else if (S.profile && !snap.metadata.hasPendingWrites) {
      this.remote.profileRef.set(cleanProfile(S.profile)).catch(e => syncError(e));
    }
  },
  onEntriesSnap(snap){
    if (this.resetting) return;
    const remote = new Map();
    snap.docs.forEach(d => { const x = d.data(); if (x && validEntry(Object.assign({id:d.id}, x))) remote.set(d.id, Object.assign({}, x, {id:d.id})); });
    if (this.firstEntries) {
      this.firstEntries = false;
      const synced = new Set(S.syncedIds);
      // migrate: local entries never seen remotely go up; ones seen before but now gone were deleted elsewhere
      S.entries.forEach(e => {
        if (!remote.has(e.id) && !synced.has(e.id)) {
          remote.set(e.id, e); this.pendingUp.set(e.id, e);
          this.remote.col.doc(e.id).set(e).then(() => this.pendingUp.delete(e.id)).catch(err => { this.pendingUp.delete(e.id); syncError(err); });
        } else if (remote.has(e.id) && (e.updatedAt || 0) > (remote.get(e.id).updatedAt || 0)) {
          remote.set(e.id, e); this.remote.col.doc(e.id).set(e).catch(err => syncError(err));
        }
      });
    }
    this.pendingUp.forEach((e, id) => remote.set(id, e));
    this.pendingDel.forEach(id => remote.delete(id));
    const next = Array.from(remote.values());
    const sig = a => a.map(e => e.id + ':' + (e.updatedAt || 0)).sort().join('|');
    S.syncedIds = Array.from(remote.keys());
    if (sig(next) !== sig(S.entries)) { S.entries = next; this.changed(); }
    else this.saveLocal();
  }
};
function validEntry(e){ return e && typeof e.id === 'string' && isFinite(e.kg) && e.kg > 10 && e.kg < 500 && isFinite(e.t); }
function cleanProfile(p){
  if (!p) return null;
  const o = {};
  ['name','unit','theme','startKg','startDate','goalKg','targetDate','paceKg','celebrated','createdAt','updatedAt'].forEach(k => { if (p[k] !== undefined) o[k] = p[k]; });
  return o;
}
let syncWarned = false;
function syncError(e){
  const code = e && e.code;
  if (code === 'quota_exceeded' || code === 'resource_exhausted') toast('Cloud storage is full. Your entries are still saved on this device.');
  else if (!syncWarned) { syncWarned = true; toast('Sync paused. Your entries are saved on this device.'); }
}

/* =====================================================================
   Analysis
   ===================================================================== */
let A = null, Av = -1;
function analysis(){ if (Av !== S.v || !A) { A = analyze(S.profile, S.entries); Av = S.v; } return A; }

function analyze(p, entries){
  const today = todayKey();
  const dir = Math.sign(p.goalKg - p.startKg) || -1; // -1 loss journey, +1 gain journey
  const sorted = entries.slice().sort((a, b) => a.t - b.t);
  const byDay = new Map();
  sorted.forEach(e => { const k = keyOf(e.t); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); });
  const days = Array.from(byDay.keys()).sort().map(k => {
    const es = byDay.get(k), ws = es.map(e => e.kg);
    return {key:k, entries:es, avg:mean(ws), min:Math.min.apply(null, ws), max:Math.max.apply(null, ws), n:es.length};
  });
  // 7-day moving average of daily averages
  let j = 0;
  days.forEach((d, i) => {
    const from = addDays(d.key, -6);
    while (days[j].key < from) j++;
    const win = days.slice(j, i + 1).map(x => x.avg);
    d.trend = mean(win);
  });
  const trendAt = k => { let r = null; for (let i = 0; i < days.length && days[i].key <= k; i++) r = days[i].trend; return r; };
  const last = days[days.length - 1] || null;
  const current = last ? last.trend : p.startKg;
  const latest = sorted[sorted.length - 1] || null;
  const toward = d => d * dir; // positive = moving toward goal
  const totalChange = current - p.startKg;
  const journey = Math.abs(p.goalKg - p.startKg) || 1;
  const progress = clamp(toward(totalChange) / journey, 0, 1);
  const remaining = Math.max(0, (p.goalKg - current) * dir);
  const goalReached = days.length > 0 && (current - p.goalKg) * dir >= 0;

  // weekly (Mon-start)
  const weeks = [];
  if (days.length) {
    let ws = weekStartKey(days[0].key);
    const endWs = weekStartKey(today);
    let prev = p.startDate && p.startDate <= days[0].key ? p.startKg : days[0].avg;
    let guard = 0;
    while (ws <= endWs && guard++ < 600) {
      const we = addDays(ws, 6);
      const endK = we < today ? we : today;
      const t = trendAt(endK);
      const hasData = days.some(d => d.key >= ws && d.key <= we);
      weeks.push({start:ws, end:we, change: t != null ? t - prev : 0, hasData, partial: we >= today});
      if (t != null) prev = t;
      ws = addDays(ws, 7);
    }
  }
  const dataWeeks = weeks.filter(w => w.hasData);
  const complete = dataWeeks.filter(w => !w.partial);
  const prevWs = addDays(weekStartKey(today), -7);
  const lastWeek = complete.length && complete[complete.length - 1].start === prevWs ? complete[complete.length - 1] : null;
  const daysSinceLog = last ? diffDays(last.key, today) : null;
  const thisWeek = weeks.length && weeks[weeks.length - 1].partial ? weeks[weeks.length - 1] : null;
  let bestWeek = null;
  dataWeeks.forEach(w => { if (toward(w.change) > 0.05 && (!bestWeek || toward(w.change) > toward(bestWeek.change))) bestWeek = w; });
  const weeksToward = dataWeeks.filter(w => toward(w.change) > 0.01).length;

  // last 7 days change
  const t7 = trendAt(addDays(today, -7));
  const change7 = last && t7 != null && last.key >= addDays(today, -3) ? current - t7 : null;

  // pace overall and regression on last 28 days
  const startK = p.startDate && isValidKey(p.startDate) ? p.startDate : (days[0] ? days[0].key : today);
  const elapsed = diffDays(startK, today);
  const paceAll = elapsed >= 7 && days.length >= 2 ? totalChange / elapsed * 7 : null;
  const recent = days.filter(d => d.key >= addDays(today, -27));
  let slope = null;
  if (recent.length >= 4 && diffDays(recent[0].key, recent[recent.length - 1].key) >= 6) {
    const xs = recent.map(d => diffDays(recent[0].key, d.key)), ys = recent.map(d => d.avg);
    const mx = mean(xs), my = mean(ys);
    let num = 0, den = 0;
    xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) * (x - mx); });
    slope = den ? num / den : 0;
  }
  const pace4 = slope != null ? slope * 7 : null;
  let projKey = null, projDays = null;
  if (!goalReached && slope != null && toward(slope) > 0.0005 && remaining > 0) {
    projDays = Math.ceil(remaining / Math.abs(slope));
    if (projDays <= 3 * 365) projKey = addDays(today, projDays); else projDays = null;
  }
  const target = p.targetDate && isValidKey(p.targetDate) ? p.targetDate : null;
  const scheduleDays = projKey && target ? diffDays(projKey, target) : null; // + ahead
  const neededPace = target && !goalReached && diffDays(today, target) > 0 ? remaining / diffDays(today, target) * 7 : null;

  // streak
  const daySet = new Set(days.map(d => d.key));
  let streak = 0;
  { let k = daySet.has(today) ? today : addDays(today, -1); while (daySet.has(k)) { streak++; k = addDays(k, -1); } }
  let longest = 0, run = 0, prevK = null;
  days.forEach(d => { run = prevK && diffDays(prevK, d.key) === 1 ? run + 1 : 1; longest = Math.max(longest, run); prevK = d.key; });

  // extreme (lowest for loss / highest for gain)
  let extreme = null;
  sorted.forEach(e => { if (!extreme || (e.kg - extreme.kg) * dir > 0) extreme = e; });
  const firstK = days[0] ? days[0].key : today;
  const spanDays = days.length ? diffDays(firstK, today) + 1 : 0;

  // extreme in 30 days
  let best30 = false;
  if (last && last.key >= addDays(today, -1)) {
    const d30 = days.filter(d => d.key >= addDays(today, -29));
    if (d30.length >= 7 && days.length >= 10) best30 = d30.every(d => d === last || (last.avg - d.avg) * dir > 0);
  }

  // patterns
  const meDiffs = [];
  days.forEach(d => {
    const m = d.entries.filter(e => new Date(e.t).getHours() < 12).map(e => e.kg);
    const ev = d.entries.filter(e => new Date(e.t).getHours() >= 17).map(e => e.kg);
    if (m.length && ev.length) meDiffs.push(mean(ev) - mean(m));
  });
  const morningVsEvening = meDiffs.length >= 3 ? {diff:mean(meDiffs), days:meDiffs.length} : null;
  const swings = days.filter(d => d.n >= 2).map(d => d.max - d.min);
  const swing = swings.length >= 3 ? {avg:mean(swings), max:Math.max.apply(null, swings), days:swings.length} : null;
  const wdBuckets = Array.from({length:7}, () => []);
  let pairs = 0;
  for (let i = 1; i < days.length; i++) if (diffDays(days[i-1].key, days[i].key) === 1) { wdBuckets[fromKey(days[i].key).getDay()].push(days[i].avg - days[i-1].avg); pairs++; }
  let bestWeekday = null;
  if (pairs >= 14) wdBuckets.forEach((b, wd) => { if (b.length >= 2) { const m = mean(b); if (!bestWeekday || toward(m) > toward(bestWeekday.avg)) bestWeekday = {wd, avg:m}; } });
  if (bestWeekday && toward(bestWeekday.avg) <= 0) bestWeekday = null;

  const out = {today, dir, sorted, days, trendAt, last, current, latest, totalChange, journey, progress, remaining, goalReached,
    weeks, dataWeeks, lastWeek, thisWeek, bestWeek, weeksToward, change7, paceAll, pace4, slope, projKey, projDays, target,
    scheduleDays, neededPace, daysSinceLog, streak, longest, extreme, spanDays, best30, morningVsEvening, swing, bestWeekday, startK, elapsed,
    toward};
  out.milestones = milestones(p, out);
  return out;
}

function milestones(p, a){
  const unit = p.unit || 'lb', dir = a.dir;
  const conv = unit === 'lb' ? LB : 1;
  const sU = U.to(p.startKg, unit), gU = U.to(p.goalKg, unit);
  const journeyU = Math.abs(gU - sU);
  const word = dir < 0 ? 'down' : 'up';
  const list = [];
  for (let n = 5; n < journeyU - 0.05; n += 5) list.push({id:'amt-' + unit + '-' + n, kind:'w', title:n + ' ' + unit + ' ' + word, targetKg:p.startKg + dir * n * conv, sub:'Every 5 ' + unit + ' counts'});
  if (journeyU >= 2) list.push({id:'half', kind:'w', title:'Halfway there', targetKg:p.startKg + (p.goalKg - p.startKg) / 2, sub:'50% of the journey'});
  if (dir < 0) { for (let v = Math.floor((sU - 0.001) / 10) * 10; v > gU + 0.001; v -= 10) list.push({id:'dec-' + unit + '-' + v, kind:'w', strict:true, title:'Under ' + v, targetKg:v * conv, sub:'A new decade'}); }
  else { for (let v = Math.ceil((sU + 0.001) / 10) * 10; v < gU - 0.001; v += 10) list.push({id:'dec-' + unit + '-' + v, kind:'w', strict:true, title:'Over ' + v, targetKg:v * conv, sub:'A new decade'}); }
  list.push({id:'goal', kind:'w', title:'Goal ' + U.to(p.goalKg, unit).toFixed(unit === 'lb' ? 0 : 1).replace(/\.0$/, ''), targetKg:p.goalKg, sub:'You did it', isGoal:true});
  list.sort((x, y) => Math.abs(x.targetKg - p.startKg) - Math.abs(y.targetKg - p.startKg) || (x.isGoal ? 1 : -1));
  const reached = (avg, m) => m.strict ? (dir < 0 ? avg < m.targetKg - 1e-9 : avg > m.targetKg + 1e-9) : (avg - m.targetKg) * dir >= -1e-9;
  list.forEach(m => {
    const d = a.days.find(d => reached(d.avg, m));
    m.earned = !!d; m.date = d ? d.key : null;
    m.toGo = m.earned ? 0 : Math.abs(a.current - m.targetKg);
  });
  // streak milestones
  const streaks = [7, 30, 100].map(n => ({id:'streak-' + n, kind:'s', title:n + '-day streak', n, sub:'Logged ' + n + ' days in a row'}));
  let run = 0, prevK = null;
  a.days.forEach(d => { run = prevK && diffDays(prevK, d.key) === 1 ? run + 1 : 1; prevK = d.key; streaks.forEach(s => { if (!s.date && run >= s.n) s.date = d.key; }); });
  streaks.forEach(s => { s.earned = !!s.date; s.toGo = s.earned ? 0 : s.n - a.streak; });
  const weight = list;
  const next = weight.find(m => !m.earned) || null;
  return {weight, streaks, all:weight.concat(streaks), next};
}
const earnedIds = a => a.milestones.all.filter(m => m.earned).map(m => m.id);

function verb(kgDelta, a){ // "lost" / "gained"
  return kgDelta < 0 ? 'lost' : 'gained';
}
function headlines(a, p){
  const H = [], u = U.unit;
  const hl = s => '<span class="hl">' + s + '</span>';
  if (!a.days.length) { H.push('Day one. Log your first weigh-in to start your trend.'); return H; }
  if (a.daysSinceLog >= 3) H.push('Welcome back. Your last weigh-in was ' + hl(plural(a.daysSinceLog, 'day') + ' ago') + '. One log today restarts your streak.');
  if (a.goalReached) H.push('You reached ' + hl(U.n(p.goalKg) + ' ' + u) + '. That is your goal. Incredible work.');
  if (a.lastWeek && a.toward(a.lastWeek.change) > 0.05) {
    const best = a.bestWeek === a.lastWeek && a.dataWeeks.length >= 3;
    H.push('You ' + verb(a.lastWeek.change) + ' ' + hl(U.abs(a.lastWeek.change) + ' ' + u) + ' last week' + (best ? ', your best week yet.' : '.'));
  }
  if (a.change7 != null && a.toward(a.change7) > 0.05 && !(a.lastWeek && a.toward(a.lastWeek.change) > 0.05)) H.push(hl(U.abs(a.change7) + ' ' + u) + ' ' + (a.change7 < 0 ? 'down' : 'up') + ' in the last 7 days. Keep that rhythm.');
  if (a.best30) H.push(hl((a.dir < 0 ? 'Lowest' : 'Highest') + ' weight in 30 days') + '. The trend is real.');
  const nx = a.milestones.next;
  if (nx && !nx.isGoal && nx.toGo > 0) H.push(hl(U.abs(nx.toGo) + ' ' + u) + ' to your next milestone: ' + esc(nx.title) + '.');
  if (a.projKey && a.scheduleDays != null && a.scheduleDays >= 7) H.push('On pace to hit ' + U.n(p.goalKg) + ' ' + u + ' by ' + hl(fmtDY(a.projKey)) + ', about ' + Math.round(a.scheduleDays / 7) + ' weeks early.');
  else if (a.projKey) H.push('At this pace you reach ' + U.n(p.goalKg) + ' ' + u + ' around ' + hl(fmtDY(a.projKey)) + '.');
  if (a.streak >= 3) H.push(hl(a.streak + '-day') + ' logging streak. ' + (a.days[a.days.length - 1].key === a.today ? 'Consistency is paying off.' : 'Log today to keep it going.'));
  if (a.progress > 0.02 && !a.goalReached) H.push('You are ' + hl(Math.round(a.progress * 100) + '%') + ' of the way to ' + U.n(p.goalKg) + ' ' + u + '.');
  if (!H.length) H.push(a.days.length < 3 ? 'Great start. A few more days and your trend line appears.' : 'Every weigh-in sharpens the picture. You are building momentum.');
  return H;
}

function ringSVG(pct, size){

function heroHTML(a, p){

  const deltaCls = moved >= -0.05 ? '' : ' away';
  const deltaTxt = a.days.length && Math.abs(U.to(a.totalChange)) >= 0.05 ? (U.signed(a.totalChange) + ' ' + u + ' since ' + fmtDY(a.startK)) : 'Day one';
  const nowPct = clamp(a.progress, 0, 1) * 100;

function trendCardHTML(a){

function tilesHTML(a, p){

/* ---------------- Insights ---------------- */
function viewInsights(a, p){
  const u = U.unit;
  const head = '<div class="page-head"><div><h1>Insights</h1><p>What your data says about your progress</p></div></div>';
  if (a.days.length < 2) return head + '<section class="card"><div class="empty"><b>Insights unlock as you log</b>Log on ' + (2 - a.days.length) + ' more day' + (a.days.length === 1 ? '' : 's') + ' to see your first analysis. Patterns appear after about two weeks.</div></section>';
  const lostWord = a.dir < 0 ? 'Total lost' : 'Total gained';
  const tv = a.toward(a.totalChange);
  const sum = '<section class="card" aria-label="Summary"><div class="eyebrow">' + lostWord + '</div>' +
    '<div class="bigstat ' + (tv >= 0 ? 't-good' : 't-bad') + '">' + U.abs(tv > 0 ? a.totalChange : 0) + '<small>' + u + '</small></div>' +
    '<p class="card-sub" style="font-size:14px;color:var(--ink-2)">' + (tv > 0 ? Math.round(a.progress * 100) + '% of your ' + U.abs(p.goalKg - p.startKg) + ' ' + u + ' journey, in ' + plural(Math.max(1, Math.round(a.elapsed / 7)), 'week') + '. ' + (a.goalReached ? 'Goal reached.' : U.abs(a.remaining) + ' ' + u + ' to go.') : 'Trend is still settling. Early weeks are noisy; the line evens out.') + '</p></section>';
  const s = (label, val, sub, cls) => '<div class="tile"><div class="t-label">' + label + '</div><div class="t-val ' + (cls || '') + '">' + val + '</div><div class="t-sub">' + sub + '</div></div>';
  const good = v => v != null && a.toward(v) > 0 ? 't-good' : v != null && a.toward(v) < 0 ? 't-bad' : '';
  let proj, projSub, projCls = '';
  if (a.goalReached) { proj = 'Reached'; projSub = 'Goal achieved'; projCls = 't-good'; }
  else if (a.projKey) { proj = fmtD(a.projKey); projSub = fmtD(a.projKey, {year:'numeric'}) + ' at the last 4 weeks’ pace'; }
  else { proj = 'Not yet'; projSub = a.slope == null ? 'Needs about a week more data' : a.toward(a.slope) > 0.0005 ? 'Over 3 years at the current pace' : 'Trend is flat right now. One good week changes this.'; }
  let sched = '–', schedSub = a.target ? 'Target ' + fmtDY(a.target) : 'No target date set', schedCls = '';
  if (a.scheduleDays != null) {
    const w = Math.round(Math.abs(a.scheduleDays) / 7);
    if (a.scheduleDays >= 7) { sched = w + '<small>wk ahead</small>'; schedCls = 't-good'; }
    else if (a.scheduleDays > -7) { sched = 'On time'; schedCls = 't-good'; }
    else { sched = w + '<small>wk behind</small>'; schedCls = 't-warm'; schedSub = 'Need ' + U.abs(a.neededPace || 0) + ' ' + u + '/wk for ' + fmtD(a.target); }
  } else if (a.target && a.neededPace != null) { schedSub = 'Need ' + U.abs(a.neededPace) + ' ' + u + '/wk to hit ' + fmtD(a.target); }
  const grid = '<section class="statgrid" aria-label="Statistics">' +
    s('Avg weekly change', a.paceAll == null ? '–' : U.signed(a.paceAll) + '<small>' + u + '</small>', 'Since ' + fmtDY(a.startK), good(a.paceAll)) +
    s('Last 4 weeks', a.pace4 == null ? '–' : U.signed(a.pace4) + '<small>' + u + '/wk</small>', a.pace4 != null && a.paceAll != null && a.toward(a.pace4) > 0 && a.toward(a.pace4) - a.toward(a.paceAll) > 0.05 ? 'Faster than your average' : 'Linear trend, 28 days', good(a.pace4)) +
    s('Projected goal', proj, projSub, projCls) +
    s('Schedule', sched, schedSub, schedCls) +
    s('Best week', a.bestWeek ? U.signed(a.bestWeek.change) + '<small>' + u + '</small>' : '–', a.bestWeek ? 'Week of ' + fmtD(a.bestWeek.start) : 'Your first good week is coming', a.bestWeek ? 't-good' : '') +
    s('Weeks ' + (a.dir < 0 ? 'down' : 'up'), a.weeksToward + '<small>of ' + a.dataWeeks.length + '</small>', a.dataWeeks.length ? Math.round(a.weeksToward / a.dataWeeks.length * 100) + '% of weeks moved toward goal' : '') +
    s('Weigh-ins', a.sorted.length + '', (a.sorted.length / a.days.length).toFixed(1) + ' per logged day, ' + a.days.length + ' of ' + a.spanDays + ' days') +
    s('Logging streak', a.streak + '<small>days</small>', 'Longest: ' + a.longest + ' days', a.streak >= 3 ? 't-warm' : '') +
    s(a.dir < 0 ? 'Lowest ever' : 'Highest ever', U.n(a.extreme.kg) + '<small>' + u + '</small>', fmtDY(keyOf(a.extreme.t)) + ', ' + fmtTime(a.extreme.t)) +
    '</section>';
  const weekly = '<section class="card" aria-labelledby="wk-h"><div class="card-head"><div><h2 id="wk-h">Weekly change</h2><p class="card-sub">Monday to Sunday, based on your trend</p></div></div>' +
    '<div class="chart weekbars" id="week-chart" role="img" aria-label="Weekly change bar chart"></div>' +
    '<div class="legend" aria-hidden="true"><span><i class="lg-dot" style="background:var(--good-fill);border-radius:3px"></i>Toward goal</span><span><i class="lg-dot" style="background:var(--amber);border-radius:3px"></i>Away from goal</span></div></section>';
  // patterns
  const pats = [];
  if (a.morningVsEvening) { const d = a.morningVsEvening.diff; pats.push('<div class="pattern"><div class="eyebrow">Morning vs evening</div><div class="p-val">' + U.abs(d) + ' ' + u + ' ' + (d >= 0 ? 'lower' : 'higher') + '</div><p>Mornings average ' + U.abs(d) + ' ' + u + ' ' + (d >= 0 ? 'lower' : 'higher') + ' than evenings, across ' + a.morningVsEvening.days + ' days. Compare morning to morning for the clearest read.</p></div>'); }
  if (a.swing) pats.push('<div class="pattern"><div class="eyebrow">Typical daily swing</div><div class="p-val">' + U.abs(a.swing.avg) + ' ' + u + '</div><p>Your weight moves about ' + U.abs(a.swing.avg) + ' ' + u + ' within a day. A single high reading is just water, not progress lost.</p></div>');
  if (a.bestWeekday) pats.push('<div class="pattern"><div class="eyebrow">Best weekday</div><div class="p-val">' + WD[a.bestWeekday.wd] + '</div><p>' + WD[a.bestWeekday.wd] + 's average ' + U.signed(a.bestWeekday.avg) + ' ' + u + ' vs the day before. Whatever you do the day before, it works.</p></div>');
  const patterns = '<section class="card" aria-labelledby="pat-h"><div class="card-head"><div><h2 id="pat-h">Patterns</h2><p class="card-sub">Found in your weigh-ins</p></div></div>' +
    (pats.length ? '<div class="pattern-grid">' + pats.join('') + '</div>' : '<div class="empty"><b>Patterns need a little more data</b>Log twice on some days (morning and evening) for a couple of weeks to unlock these.</div>') + '</section>';
  return head + '<div class="stack">' + sum + grid + '<div class="grid-2 even">' + weekly + milestoneTimelineHTML(a) + '</div>' + patterns + badgesHTML(a) + '</div>';
}
function milestoneTimelineHTML(a){

function medalSVG(earned, kind, size){

function badgesHTML(a){

/* ---------------- History ---------------- */
function viewHistory(a, p){
  const head = '<div class="page-head"><div><h1>History</h1><p>' + a.sorted.length + ' weigh-ins over ' + a.days.length + ' days</p></div>' +
    '<button class="btn secondary sm" type="button" data-act="export">' + ic('download', 'xs') + 'Export CSV</button></div>';
  if (!a.days.length) return head + '<section class="card"><div class="empty"><b>Nothing here yet</b>Your weigh-ins will appear here, grouped by day.</div><button class="btn block" type="button" data-act="log">' + ic('plus', 'sm') + 'Log your first weigh-in</button></section>';
  // heatmap: last 9 weeks
  const endWs = weekStartKey(a.today), startWs = addDays(endWs, -56);
  const counts = new Map(a.days.map(d => [d.key, d.n]));
  let heat = '<div class="heat" role="grid" aria-label="Logging calendar, last 9 weeks"><span></span>' + ['M','T','W','T','F','S','S'].map(x => '<span class="hd" aria-hidden="true">' + x + '</span>').join('');
  for (let w = 0; w < 9; w++) {
    const ws = addDays(startWs, w * 7);
    const d0 = fromKey(ws);
    const showMonth = w === 0 || fromKey(addDays(ws, 6)).getDate() <= 7;
    heat += '<span class="mo">' + (showMonth ? fmtD(addDays(ws, 6), {month:'short'}) : '') + '</span>';
    for (let i = 0; i < 7; i++) {
      const k = addDays(ws, i), n = counts.get(k) || 0;
      const fut = k > a.today;
      const lvl = n >= 3 ? 'l3' : n === 2 ? 'l2' : n === 1 ? 'l1' : '';
      heat += '<button type="button" class="hcell ' + lvl + (fut ? ' future' : '') + (k === a.today ? ' today' : '') + '" ' + (fut ? 'tabindex="-1" aria-hidden="true"' : 'data-act="heat" data-k="' + k + '" aria-label="' + fmtD(k, {weekday:'long', month:'long', day:'numeric'}) + ': ' + n + ' weigh-in' + (n === 1 ? '' : 's') + '"') + '>' + fromKey(k).getDate() + '</button>';
    }
  }
  heat += '</div><div class="heat-legend" aria-hidden="true">Fewer <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i> More</div>';
  const loggedIn9 = a.days.filter(d => d.key >= startWs).length;
  const heatCard = '<section class="card" aria-labelledby="heat-h"><div class="card-head"><div><h2 id="heat-h">Consistency</h2><p class="card-sub">Logged ' + loggedIn9 + ' of the last ' + (diffDays(startWs, a.today) + 1) + ' days · ' + a.streak + '-day streak</p></div></div>' + heat + '</section>';
  // day list
  const days = a.days.slice().reverse();
  const shown = days.slice(0, UI.histDays);
  const lo = Math.min.apply(null, shown.map(d => d.min)), hi = Math.max.apply(null, shown.map(d => d.max));
  const span = Math.max(hi - lo, 0.5);
  const idx = new Map(a.days.map((d, i) => [d.key, i]));
  const blocks = shown.map(d => {
    const i = idx.get(d.key), prev = i > 0 ? a.days[i - 1] : null;
    let pill = '';
    if (prev) { const ch = d.avg - prev.avg; const cls = Math.abs(ch) < 0.05 ? 'neutral' : a.toward(ch) > 0 ? 'good' : 'bad'; pill = '<span class="pill ' + cls + '" title="vs ' + fmtD(prev.key) + '">' + U.signed(ch) + ' ' + U.unit + '</span>'; }
    const L = (d.min - lo) / span * 100, W = (d.max - d.min) / span * 100, M = (d.avg - lo) / span * 100;
    return '<div class="dayblock" id="day-' + d.key + '"><div class="dayhead"><h3>' + relDay(d.key) + '</h3>' + pill + '<span class="avg">' + U.n(d.avg) + ' <small style="color:var(--muted);font-weight:700">' + U.unit + ' avg</small></span></div>' +
      (d.n > 1 ? '<div class="rangebar" aria-hidden="true"><i style="left:' + L.toFixed(1) + '%;width:' + W.toFixed(1) + '%"></i><em style="left:' + M.toFixed(1) + '%"></em></div><div class="rangecap"><span>Low ' + U.n(d.min) + '</span><span>Range ' + U.abs(d.max - d.min) + ' ' + U.unit + '</span><span>High ' + U.n(d.max) + '</span></div>' : '') +
      '<div class="list">' + d.entries.slice().reverse().map(e => entryRow(e)).join('') + '</div></div>';
  }).join('');
  const more = days.length > UI.histDays ? '<button class="btn secondary block" type="button" data-act="more" style="margin-top:12px">Show older days (' + (days.length - UI.histDays) + ' more)</button>' : '';
  return head + '<div class="stack">' + heatCard + '<section class="card" aria-label="Weigh-ins by day">' + blocks + more + '</section></div>';
}

function readGoalForm(){
  const p = S.profile;
  // an untouched field keeps its exact stored kg, so saving never drifts values by display rounding
  const kgOf = (id, orig) => { const raw = $(id).value.trim(); if (raw === U.n(orig)) return orig; const v = parseNum(raw); return isFinite(v) ? U.from(v) : NaN; };
  const pace = $('.pace-opt[aria-pressed="true"]');
  return {goalKg: kgOf('#g-goal', p.goalKg), startKg: kgOf('#g-start', p.startKg), targetDate: $('#g-target').value || null, startDate: $('#g-startd').value || p.startDate,
    paceKg: pace ? U.from(+pace.dataset.v) : p.paceKg};
}
function goalPreview(){
  const el = $('#goal-chart'); if (!el) return;
  const a = analysis(), f = readGoalForm();
  const p = Object.assign({}, S.profile, Object.fromEntries(Object.entries(f).filter(([k, v]) => v != null && !(typeof v === 'number' && isNaN(v)))));
  drawGoalChart(el, a, p);
  const u = U.unit, from = a.days.length ? a.current : p.startKg;
  const rem = Math.abs(p.goalKg - from);
  const reached = (from - p.goalKg) * (Math.sign(p.goalKg - p.startKg) || -1) >= 0;
  let txt;
  if (reached) txt = 'You are at your goal. Consider setting a new one, or hold steady and enjoy it.';
  else {
    const weeks = rem / (p.paceKg || U.from(1));
    const planK = addDays(a.today, Math.ceil(weeks * 7));
    txt = 'At <b>' + (+U.to(p.paceKg).toFixed(2)) + ' ' + u + '/week</b> you reach ' + U.n(p.goalKg) + ' ' + u + ' around <b>' + fmtDY(planK) + '</b>, ' + Math.ceil(weeks) + ' weeks from now.';
    if (p.targetDate && isValidKey(p.targetDate)) {
      const dd = diffDays(a.today, p.targetDate);
      if (dd > 0) { const need = rem / dd * 7; txt += ' To hit ' + fmtDY(p.targetDate) + ' you need <b>' + U.abs(need) + ' ' + u + '/week</b>' + (U.to(need) > 2.05 && u === 'lb' || U.to(need) > 1.05 && u === 'kg' ? ', which is ambitious. A later date keeps it sustainable.' : '. Very doable.'); }
    }
    if (a.projKey) txt += ' Your current pace points to <b>' + fmtDY(a.projKey) + '</b>.';
  }
  $('#goal-motive').innerHTML = txt;
}

/* =====================================================================
   Charts (inline SVG)
   ===================================================================== */
function niceStep(range, count){ const raw = range / Math.max(1, count); const mag = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / mag; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag; }
function monoPath(pts){
  const n = pts.length; if (n < 2) return '';
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i+1][0] - pts[i][0]; m[i] = dx[i] ? (pts[i+1][1] - pts[i][1]) / dx[i] : 0; }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i-1] * m[i] <= 0 ? 0 : (m[i-1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i+1] = 0; continue; }
    const al = t[i] / m[i], be = t[i+1] / m[i], s = al * al + be * be;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * al * m[i]; t[i+1] = k * be * m[i]; }
  }
  let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += ' C' + (pts[i][0] + h).toFixed(1) + ',' + (pts[i][1] + t[i] * h).toFixed(1) + ' ' + (pts[i+1][0] - h).toFixed(1) + ',' + (pts[i+1][1] - t[i+1] * h).toFixed(1) + ' ' + pts[i+1][0].toFixed(1) + ',' + pts[i+1][1].toFixed(1); }
  return d;
}
function yScale(lo, hi, top, bottom, count){
  const step = niceStep(Math.max(hi - lo, 0.5), count);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = a; v <= b + step * 1e-6; v += step) ticks.push(+v.toFixed(4));
  const f = v => bottom - (v - a) / ((b - a) || 1) * (bottom - top);
  return {f, ticks, a, b, step};
}
function dateTicks(startMs, endMs, width){
  const days = (endMs - startMs) / DAY;
  const maxLabels = Math.max(2, Math.floor(width / 64));
  const steps = [1, 2, 3, 7, 14, 21, 30, 61, 91, 182, 365];
  const st = steps.find(s => days / s <= maxLabels) || 365;
  const out = []; const k0 = keyOf(startMs);
  for (let i = 0; i <= days; i += st) { const k = addDays(k0, i); out.push(k); }
  return {keys:out, step:st};
}
function svgOpen(W, H, label){ return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" aria-hidden="true">'; }

function drawTrendChart(el){
  const a = analysis(), p = S.profile;
  const W = Math.max(260, Math.round(el.clientWidth || 320));
  const H = W < 520 ? 230 : 290;
  const pad = {l:40, r:18, t:30, b:30};
  if (!a.days.length) { el.innerHTML = '<div class="chart-empty" style="position:relative;min-height:200px"><b>Your trend starts here</b>Log a weigh-in and come back tomorrow. After 3 days your trend line appears.</div>'; return; }
  const today = a.today;
  const back = {'1W':6, '1M':29, '3M':89}[UI.range];
  let startK = back != null ? addDays(today, -back) : a.days[0].key;
  if (diffDays(startK, today) < 6) startK = addDays(today, -6);
  const inRange = a.days.filter(d => d.key >= startK);
  const spanD = diffDays(startK, today) + 1;
  let endMs = fromKey(today).getTime() + DAY;
  let proj = null;
  if ((UI.range === 'ALL' || UI.range === '3M') && a.projKey && !a.goalReached && a.days.length >= 3) {
    const ext = Math.min(a.projDays, Math.max(10, Math.round(spanD * 0.55)));
    endMs = fromKey(today).getTime() + DAY + ext * DAY;
    const endVal = a.current + a.slope * ext;
    proj = {ext, full: ext >= a.projDays, endVal: a.projDays <= ext ? p.goalKg : endVal};
  }
  const startMs = fromKey(startK).getTime();
  const X = ms => pad.l + (ms - startMs) / (endMs - startMs) * (W - pad.l - pad.r);
  const ents = a.sorted.filter(e => e.t >= startMs);
  const vals = ents.map(e => e.kg).concat(inRange.map(d => d.trend));
  if (!vals.length) vals.push(a.current);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const showGoalInDomain = proj || UI.range === 'ALL' || UI.range === '3M' && Math.abs(a.current - p.goalKg) < (hi - lo) * 2.5;
  if (showGoalInDomain) { lo = Math.min(lo, p.goalKg); hi = Math.max(hi, p.goalKg); }
  const padV = Math.max((hi - lo) * 0.08, U.from(a.days.length < 3 ? 2 : 0.4));
  const ys = yScale(U.to(lo - padV), U.to(hi + padV), pad.t, H - pad.b, H < 260 ? 4 : 5);
  const Y = kg => ys.f(U.to(kg));
  let s = svgOpen(W, H);
  // grid + y labels
  ys.ticks.forEach(v => { const y = ys.f(v); s += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (pad.l - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + (ys.step < 1 ? v.toFixed(1) : Math.round(v)) + '</text>'; });
  // x labels
  const dt = dateTicks(startMs, endMs - DAY, W - pad.l - pad.r);
  dt.keys.forEach(k => { const x = X(fromKey(k).getTime() + DAY / 2); if (x > W - pad.r - 10) return; s += '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + (UI.range === '1W' ? fmtD(k, {weekday:'short'}) : fmtD(k)) + '</text>'; });
  // today separator when projecting
  if (proj) { const xt = X(fromKey(today).getTime() + DAY / 2); s += '<line x1="' + xt.toFixed(1) + '" x2="' + xt.toFixed(1) + '" y1="' + pad.t + '" y2="' + (H - pad.b) + '" stroke="var(--line)" stroke-dasharray="2 4"/>'; }
  // goal line
  const gy = Y(p.goalKg);
  if (gy >= pad.t - 1 && gy <= H - pad.b + 1) {
    s += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '" stroke="var(--warm)" stroke-width="1.75" stroke-dasharray="6 5"/>';
    const gl = 'Goal ' + U.n(p.goalKg).replace(/\.0$/, '');
    const tw = gl.length * 6.6 + 14;
    s += '<rect x="' + (pad.l + 6) + '" y="' + (gy - 22).toFixed(1) + '" width="' + tw.toFixed(0) + '" height="18" rx="9" fill="var(--warm-soft)"/><text x="' + (pad.l + 13) + '" y="' + (gy - 9).toFixed(1) + '" font-size="11" font-weight="600" fill="var(--warm-text)">' + gl + '</text>';
  } else {
    const below = gy > H - pad.b;
    const gl = 'Goal ' + U.n(p.goalKg) + ' \u00b7 ' + U.abs(a.remaining) + ' ' + U.unit + (below ? ' below' : ' above');
    const tw = gl.length * 6.4 + 16;
    s += '<rect x="' + (W - pad.r - tw).toFixed(1) + '" y="0" width="' + tw.toFixed(1) + '" height="18" rx="9" fill="var(--warm-soft)"/><text x="' + (W - pad.r - tw / 2).toFixed(1) + '" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="var(--warm-text)">' + gl + '</text>';
  }
  // trend
  const tpts = inRange.map(d => [X(fromKey(d.key).getTime() + DAY / 2), Y(d.trend)]);
  if (tpts.length >= 2 && a.days.length >= 3) {
    const path = monoPath(tpts);
    s += '<path d="' + path + ' L' + tpts[tpts.length-1][0].toFixed(1) + ',' + (H - pad.b) + ' L' + tpts[0][0].toFixed(1) + ',' + (H - pad.b) + ' Z" fill="var(--trend-fill)"/>';
  }
  // dots
  ents.forEach(e => { s += '<circle cx="' + X(e.t).toFixed(1) + '" cy="' + Y(e.kg).toFixed(1) + '" r="' + (ents.length > 120 ? 2.2 : 3) + '" fill="var(--dot)"/>'; });
  if (tpts.length >= 2 && a.days.length >= 3) s += '<path d="' + monoPath(tpts) + '" fill="none" stroke="var(--brand-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';

    if (proj.full) {

      s += '<text x="' + lx.toFixed(1) + '" y="' + (Y(p.goalKg) + 20).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--warm-text)">' + lbl + '</text>';
    }
  }
  // latest bubble

    const val = a.days.length >= 3 ? a.current : a.last.avg;
    const ly = a.days.length >= 3 ? lastPt[1] : Y(a.last.avg);
    const lx = lastPt[0];
    const lbl = U.n(val);
    const bw = lbl.length * 7.4 + 16, bx = clamp(lx - bw / 2, pad.l, W - pad.r - bw), by = ly - 34 < 2 ? ly + 12 : ly - 34;
    s += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="22" rx="11" fill="var(--brand)"/><text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (by + 15).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">' + lbl + '</text>';
    s += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="6.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="3"/>';

  s += '<rect x="' + pad.l + '" y="0" width="' + (W - pad.l - pad.r) + '" height="' + H + '" fill="transparent" id="tc-hit" style="cursor:crosshair"/>';
  s += '</svg>';

  el.innerHTML = html;

  const move = ev => {

function drawWeekChart(el){
  const a = analysis();
  const W = Math.max(260, Math.round(el.clientWidth || 320));
  const N = W < 420 ? 8 : 12;
  const weeks = a.weeks.slice(-N);

      const ly = v < 0 ? yv + 14 : yv - 6;

    }

function drawGoalChart(el, a, p){
  const W = Math.max(260, Math.round(el.clientWidth || 320));
  const H = W < 520 ? 220 : 270, pad = {l:40, r:18, t:22, b:30};
  const today = a.today;
  const dir = Math.sign(p.goalKg - p.startKg) || -1;
  const now = a.days.length ? a.current : p.startKg;
  const rem = (p.goalKg - now) * dir;
  const pace = p.paceKg || U.from(1);
  const planDays = rem > 0 ? Math.ceil(rem / pace * 7) : 0;
  const past = a.days.filter(d => d.key >= addDays(today, -28));
  const startK = past.length ? past[0].key : today;
  let endK = addDays(today, Math.max(planDays, 14));
  if (p.targetDate && isValidKey(p.targetDate) && p.targetDate > endK) endK = p.targetDate;
  if (a.projKey && a.projKey > endK && diffDays(today, a.projKey) < 400) endK = a.projKey;
  endK = addDays(endK, 7);
  const sMs = fromKey(startK).getTime(), eMs = fromKey(endK).getTime();
  const X = k => pad.l + (fromKey(k).getTime() - sMs) / (eMs - sMs) * (W - pad.l - pad.r);
  const vals = past.map(d => d.trend).concat([now, p.goalKg]);
  if (a.slope != null) vals.push(now + a.slope * diffDays(today, endK));
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  lo = Math.max(lo, Math.min(now, p.goalKg) - Math.abs(now - p.goalKg) * 0.6 - U.from(2));
  hi = Math.min(hi, Math.max(now, p.goalKg) + Math.abs(now - p.goalKg) * 0.6 + U.from(2));
  const padV = Math.max((hi - lo) * 0.08, U.from(0.5));
  const ys = yScale(U.to(lo - padV), U.to(hi + padV), pad.t, H - pad.b, 4);
  const Y = kg => clamp(ys.f(U.to(kg)), pad.t - 4, H - pad.b + 4);
  let s = svgOpen(W, H);
  ys.ticks.forEach(v => { const y = ys.f(v); s += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--grid)"/><text x="' + (pad.l - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + (ys.step < 1 ? v.toFixed(1) : Math.round(v)) + '</text>'; });
  const dt = dateTicks(sMs, eMs, W - pad.l - pad.r);
  dt.keys.forEach(k => { const x = X(k); if (x > W - pad.r - 14) return; s += '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + fmtD(k) + '</text>'; });
  const gy = Y(p.goalKg);

    s += '<path d="M' + nowPt[0].toFixed(1) + ',' + nowPt[1].toFixed(1) + ' L' + X(ek).toFixed(1) + ',' + Y(ev).toFixed(1) + '" stroke="var(--muted)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/>';

  }

  s += '</svg>';

}

let ro = null;
function afterRender(a){
  if (ro) ro.disconnect();

  const tc = $('#trend-chart'); if (tc) draws.push([tc, () => drawTrendChart(tc)]);
  const wc = $('#week-chart'); if (wc) draws.push([wc, () => drawWeekChart(wc)]);
  const gc = $('#goal-chart'); if (gc) draws.push([gc, () => goalPreview()]);
  draws.forEach(d => d[1]());
  if ('ResizeObserver' in window) {
    const widths = new Map();
    ro = new ResizeObserver(list => list.forEach(en => {
      const w = Math.round(en.contentRect.width); const d = draws.find(x => x[0] === en.target);
      if (d && widths.get(en.target) !== undefined && Math.abs(widths.get(en.target) - w) > 4) d[1]();
