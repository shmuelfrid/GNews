<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<meta name="color-scheme" content="light dark">
<title>Momentum</title>
<meta name="description" content="Weight, calories and activity in one calm place: what to eat, what to burn, and when you will reach your goal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/today.css">
<link rel="stylesheet" href="css/food.css">
<link rel="stylesheet" href="css/activity.css">
<link rel="stylesheet" href="css/progress.css">
<link rel="stylesheet" href="css/bmi.css">
<script>
  /* apply saved theme before first paint */
  (function () { try { var t = localStorage.getItem('momentum.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
</head>
<body>
<a class="sr-only" href="#view">Skip to content</a>
<div id="app" class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brandmark" href="#today" aria-label="Momentum home">
      <span class="logo" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M4 17l5-6 4 4 7-9"/><path d="M15 6h5v5"/></svg></span>
      <span class="bm-text">Momentum</span>
    </a>
    <button type="button" class="btn btn-primary side-add" data-action="quick-add" aria-label="Add">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="btn-label">Add</span>
    </button>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <div class="main">
    <header class="topbar" id="topbar">
      <a class="brandmark" href="#today" aria-label="Momentum home">
        <span class="logo" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M4 17l5-6 4 4 7-9"/><path d="M15 6h5v5"/></svg></span>
        <span class="bm-text">Momentum</span>
      </a>
      <a class="avatar" id="topbar-avatar" href="#profile" aria-label="Profile and settings">M</a>
    </header>
    <main id="view" class="container" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
</div>
<div id="layers"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/calc.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/ai.js"></script>
<script src="js/views/onboarding.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/profile.js"></script>
<script src="js/views/food.js"></script>
<script src="js/views/activity.js"></script>
<script src="js/views/progress.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/bmi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
